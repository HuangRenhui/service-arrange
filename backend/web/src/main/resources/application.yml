server:
  port: 8082 #服务器端口
  servlet:
    context-path: /servicearrange #应用的上下文路径

spring:
  application:
    name: servicearrange #项目名称
  #rabbitmq配置
  cloud:
    stream:
      binders:
        rabbit_cluster:
          environment:
            spring:
              rabbitmq:
                addresses: 8.129.116.16:5672
                password: guest
                username: guest
          type: rabbit
      bindings:
        output_channel:
          binder: rabbit_cluster
          content-type: application/json
          destination: ${spring.application.name}-exchange-point
        shell_task_status_channel:
          binder: rabbit_cluster
          content-type: application/json
          destination: ${spring.application.name}-exchange-point
          group: ${task.shell_task_status}
        task_result_input_channel:
          binder: rabbit_cluster
          consumer:
            concurrency: ${task.consumer.result-concurrency:2}
            max-attempts: 1
          content-type: application/json
          destination: ${spring.application.name}-exchange-point
          group: ${task.result_queue_name}
        task_run_input_channel:
          binder: rabbit_cluster
          consumer:
            concurrency: ${task.consumer.run-concurrency:2}
            max-attempts: 1
          content-type: application/json
          destination: ${spring.application.name}-exchange-point
          group: ${task.run_queue_name}
      rabbit:
        bindings:
          output_channel:
            producer:
              routing-key-expression: headers.receiveSign
          shell_task_status_channel:
            consumer:
              binding-routing-key: ${{task.shell_task_status}
          task_result_input_channel:
            consumer:
              acknowledge-mode: manual
              binding-routing-key: ${task.result_queue_name}
          task_run_input_channel:
            consumer:
              acknowledge-mode: manual
              binding-routing-key: ${task.run_queue_name}
  #mongodb配置
  data:
    mongodb:
      database: admin
      host: 8.129.116.16
      password: 123456
      port: 27017
      username: admin
      #连接池与超时：避免线程长期阻塞在数据库IO上
      connections-per-host: 50
      connect-timeout: 5000
      socket-timeout: 30000
      max-wait-time: 5000
      max-idle-time: 60000
  #指定打包环境
  profiles:
    active: jar

#zk配置
zk:
  session-timeout: 5000
  url: 8.129.116.16:2181

task:
  result_queue_name: /task/result
  run_queue_name: /task/run
  #消费端并发与背压保护
  consumer:
    #结果通道消费并发数，队列堆积时可上调，需与实例处理的串行化设计配合
    result-concurrency: 2
    #运行通道消费并发数
    run-concurrency: 2
  #HTTP算子超时：避免慢下游无限期占用消费线程
  http:
    connect-timeout: 5000
    read-timeout: 30000
  #背压保护阈值
  backpressure:
    #抢实例锁失败的最大重排队次数，超过后强制ack丢弃，防止无限requeue造成消息热点空转
    lock-nack-max-times: 10
    #重排队退避基数：单位毫秒，实际退避=基数*已重排队次数
    requeue-backoff-base-ms: 200
    #单次退避上限：单位毫秒
    requeue-backoff-max-ms: 5000
    #单条消息最大处理次数（业务nack与抢锁nack共用上限）
    max-handle-times: 5
    #重排队是否启用延迟退避
    delay-requeue-enabled: true
  #编排治理（发布门禁 / 超时 / 重试退避）
  orchestration:
    #生产环境建议 true：仅 PUBLISHED 的 Plan 可被运行
    require-published: false
    task-timeout-ms: 60000
    retry-delay-max-ms: 3000
  #错误码映射与重试分类：换协议/换厂商只改映射，执行器与编排零改动
  error-mapping:
    #未知错误码默认分类：conservative(保守→FATAL) / optimistic(乐观→RETRYABLE)
    default-action: conservative
    #无错误码场景下按可重试处理的异常类名前缀（连接超时、连接重置、瞬时SQL异常等）
    retryable-exceptions:
      - java.net.
      - java.io.IOException
      - java.util.concurrent.TimeoutException
      - java.sql.SQLTransientException
    protocols:
      http:
        #按 HTTP 状态码判定
        match: status
        success: [200, 204]
        retryable: [429, 502, 503, 504]
        fatal: [400, 401, 403, 404, 422]
        #HTTP 2xx 但响应体业务码非成功时启用（不配则只看状态码）
        body-code:
          path: "$.code"
          success: ["0"]
          retryable: ["SYS_BUSY", "LOCKED"]
          fatal: ["PARAM_INVALID", "NO_PERMISSION"]
      dubbo:
        #泛化调用经网关时按响应体错误码判定，取不到则回退 HTTP 状态码
        match: body-jsonpath
        path: "$.errorCode"
        success: ["0"]
        retryable: []
        fatal: []
      webservice:
        #按 SOAP Fault 码判定
        match: soap-fault
        retryable: ["Server.Timeout"]
        fatal: ["Client.Validation"]
      sql:
        #按 SQLState 判定：40001/40P01 可重试（死锁/串行化失败），42xxx/07xxx 不可重试
        match: sqlstate
        retryable: ["40001", "40P01"]
        fatal: ["42xxx", "07xxx"]
      script:
        #按进程退出码判定
        match: exit-code
        success: ["0"]
        retryable: []
        fatal: []